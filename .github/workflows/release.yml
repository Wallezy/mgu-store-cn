# CN publication uses an already stamped and integration-validated main commit.
# A dry run can stamp locally; it never pushes or publishes.
name: Release

on:
  workflow_dispatch:
    inputs:
      components:
        description: Component ids to release, space-separated (empty releases every changed component)
        required: false
        default: ''
      dry_run:
        description: Dry run (no release commit pushed, nothing published)
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read
  statuses: read

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commits: each runs in the job that holds the
# contents: write token.
jobs:
  publish:
    # main only: the release commit goes on top of it
    if: github.ref == 'refs/heads/main' && github.repository == 'Wallezy/mgu-store-cn'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SOURCE_DATE_EPOCH comes from each component's last commit, and
          # each component's last release from its <id>@<version> tag
          fetch-depth: 0
          # publishing talks to the API through GH_TOKEN; the push below
          # passes the token itself
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2

      - name: Check CN publication policy
        run: node release/test/cn_distribution_test.js

      # Real publication requires the committed version to pass integration.
      - name: Stamp dry run
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ${{ inputs.components }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # shellcheck disable=SC2086 # one id per word
          node release/release.js stamp $COMPONENTS
          git log -1 --stat

      # the tools' builds run make target: Docker, preinstalled on the runner
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:Wallezy/mgu-store-cn
          MGU_PUBLISH_VISIBILITY: any
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          COMPONENTS: ${{ inputs.components }}
        # publish.js checks release-check/cn-integration on the exact HEAD.
        run: |
          if [ -n "$DRY_RUN" ]; then
            node release/release.js publish --stamped --dry-run
          else
            # shellcheck disable=SC2086 # component ids, each one argument
            node release/release.js publish $COMPONENTS
          fi

      - name: Published catalog
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
        run: node release/release.js list
