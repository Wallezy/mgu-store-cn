name: CN source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - name: Publication policy
        run: node release/test/cn_distribution_test.js
      - name: CN snapshot preparation
        run: python3 -m unittest discover -s release/test -p 'test_*.py' -v
      - name: Contributor records
        run: node release/test/contributors_test.js
      - name: App packaging and release planning
        run: node tools/test/run.js
      - name: Store interface and localization
        run: |
          node apps/robertn_store/tools/test_store.js
          node apps/robertn_store/tools/test_view.js
          node apps/robertn_store/tools/test_i18n.js
      - name: Local installer
        run: node deploy/test/cn_installer.js
      - name: Distribution installer
        run: node deploy/test/edition_installer.js
  updater:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - run: sh native/mgu-updater/test/run.sh
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - run: sh native/app-privacy/test/run.sh
  deployment:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Select a disjoint share of every deployment suite
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re
          source = pathlib.Path("deploy/test/run.js").read_text()
          match = re.search(r"const SUITES = \[([\s\S]*?)\n\];", source)
          assert match, "Deployment suite list is missing"
          suites = [s.strip() for s in match[1].split(",") if s.strip()]
          assert len(suites) >= 50 and len(suites) == len(set(suites))
          assert all(re.fullmatch(r"test[A-Za-z0-9_]+", s) for s in suites)
          groups = [suites[i::4] for i in range(4)]
          assert sorted(s for group in groups for s in group) == sorted(suites)
          selected = groups[int(os.environ["SHARD"])]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("MGU_TEST_ONLY=" + ",".join(selected) + "\n")
          print(f"Running {len(selected)} of {len(suites)} suites; all four groups cover the full list")
          PYTHON
      - run: sh deploy/test/run.sh
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make -C native/mgu-render test
  uplink:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.2
          cache: false
      - run: make -C native/mgu-uplink test
# These fixtures do not set release-check/cn-integration.
