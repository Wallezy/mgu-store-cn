# CN bootstrap requires local Node.js 18+ and publishes no release or OSS data.
name: CN installer checks

on:
  push:
    branches: [main]
  pull_request:
    paths: ['deploy/**', 'apps/robertn_store/**', '.github/workflows/installer.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cn-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the bootstrap scripts against the built files, served on this runner
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      - name: CN installer fixtures
        if: runner.os != 'Windows'
        run: node deploy/test/cn_installer.js && node deploy/test/edition_installer.js

      - name: Prepare bootstrap files
        run: node deploy/installer/bootstrap.js serve/good

      - name: Serve
        run: |
          cd serve/good
          cat SHA256SUMS
          mkdir ../bad
          cp mgu-install.js ../bad/
          sed 's/^./x/' SHA256SUMS > ../bad/SHA256SUMS
          cd ..
          $(command -v python3 || command -v python) -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 50); do curl -fs http://127.0.0.1:8765/good/SHA256SUMS >/dev/null && break; sleep 0.2; done

      - name: install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: deploy/installer/test.ps1 -Base http://127.0.0.1:8765/good -BadBase http://127.0.0.1:8765/bad

      - name: install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: deploy/installer/test.ps1 -Base http://127.0.0.1:8765/good -BadBase http://127.0.0.1:8765/bad

      - name: Restart question, setup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $csc = Join-Path ([Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory()) 'csc.exe'
          New-Item -ItemType Directory -Force fake-ssh | Out-Null
          & $csc /nologo /out:fake-ssh\ssh.exe deploy\installer\prompt-test\fake_ssh.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location deploy\installer\prompt-test
          npm ci --ignore-scripts --no-audit --no-fund --silent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location

      - name: Restart question through install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: node deploy/installer/prompt-test/prompt_test.js (Get-Command powershell.exe).Source http://127.0.0.1:8765/good (Resolve-Path fake-ssh).Path

      - name: Restart question through install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: node deploy/installer/prompt-test/prompt_test.js (Get-Command pwsh.exe).Source http://127.0.0.1:8765/good (Resolve-Path fake-ssh).Path

      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          export MGU_INSTALL_DOWNLOAD=http://127.0.0.1:8765/good
          mkdir -p "/tmp/my stick" "/tmp/repo with spaces"
          echo '{"schema":2,"components":[]}' > "/tmp/repo with spaces/catalog.json"
          sh deploy/install.sh --help > help.txt
          head -3 help.txt
          sh -s -- usb-repo "/tmp/my stick" "/tmp/repo with spaces" < deploy/install.sh
          test -f "/tmp/my stick/mgu-repo/repo-with-spaces/catalog.json"
          set +e
          sh deploy/install.sh bogus; test $? = 2 || exit 1
          MGU_INSTALL_DOWNLOAD=http://127.0.0.1:8765/bad sh deploy/install.sh --help; test $? = 1 || exit 1
          true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cn-bootstrap-${{ runner.os }}-${{ runner.arch }}
          path: serve/good/
          if-no-files-found: error
          retention-days: 7
