name: CN release build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      components:
        description: Component IDs separated by spaces; retain unchanged published packages
        required: true
        default: 'mgu-updater'

permissions:
  contents: read
  actions: read

concurrency:
  group: cn-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        leg: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.2
          cache: false
      - name: Build release packages from the committed source
        env:
          COMPONENTS: ${{ inputs.components }}
          BASE: ${{ github.event.before }}
        run: |
          if [ -z "$COMPONENTS" ]; then
            COMPONENTS=$(python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = os.environ.get("BASE", "")
          ids = set()
          if base and set(base) != {"0"}:
              files = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines()
              for name in files:
                  parts = pathlib.PurePosixPath(name).parts
              if parts and parts[0] in ("release", "tools", ".github"):
                  manifests = list(pathlib.Path("native").glob("*/component.json"))
                  manifests += list(pathlib.Path("apps").glob("*/mgu-app.json"))
                  manifests += [pathlib.Path("deploy/component.json")]
                  for item in manifests:
                      ids.add(json.loads(item.read_text())["id"])
                  break
                  if len(parts) > 2 and parts[0] in ("native", "apps"):
                      folder = pathlib.Path(*parts[:2])
                      manifest = folder / ("component.json" if parts[0] == "native" else "mgu-app.json")
                  elif parts and parts[0] == "deploy":
                      manifest = pathlib.Path("deploy/component.json")
                  else:
                      continue
                  if manifest.is_file():
                      ids.add(json.loads(manifest.read_text())["id"])
          print(" ".join(sorted(ids)) or "mgu-updater")
          PY
            )
          fi
          read -r -a ids <<< "$COMPONENTS"
          node release/release.js build "${ids[@]}"
          python3 release/online_build.py seal --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --out release/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cn-release-${{ github.sha }}-${{ matrix.leg }}
          path: release/out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
  reproducibility:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cn-release-$GITHUB_SHA-a" --dir a
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cn-release-$GITHUB_SHA-b" --dir b
          diff -qr a b
